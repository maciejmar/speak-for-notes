services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: notebook-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-proxy:
    image: alpine/socat
    container_name: notebook-ollama-proxy
    restart: unless-stopped
    network_mode: host
    # Nasłuchuje TYLKO na adresie mostka Dockera (nieroutowalny z zewnątrz),
    # przekazuje do Ollamy, która pozostaje zbindowana wyłącznie do 127.0.0.1
    # (żeby nie zmieniać widoczności Ollamy dla innych aplikacji na serwerze).
    command: TCP-LISTEN:11434,bind=172.17.0.1,fork,reuseaddr TCP:127.0.0.1:11434

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: notebook-backend
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      - qdrant
      - ollama-proxy
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notebook-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend

volumes:
  qdrant_storage:
